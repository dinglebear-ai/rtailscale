[workspace]
members = [".", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.97.1"
authors = ["dinglebear.ai <hello@dinglebear.ai>"]
license = "MIT"
readme = "README.md"
homepage = "https://rtailscale.dinglebear.ai"
repository = "https://github.com/dinglebear-ai/rtailscale"
description = "MCP server and CLI for Tailscale: inspect and manage tailnet devices, routes, users, keys, DNS, and ACL policy over stdio or streamable HTTP."

[workspace.dependencies]
anyhow = "1"
rmcp = { version = "=3.1.0", default-features = false }

[workspace.lints.clippy]
missing_safety_doc = "deny"
mod_module_files = "deny"

[workspace.lints.rust]
missing_crate_level_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
private_intra_doc_links = "warn"
bare_urls = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"
invalid_html_tags = "deny"

[package]
name = "tailscale-rmcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
categories = ["command-line-utilities", "api-bindings", "network-programming", "development-tools"]
keywords = ["mcp", "tailscale", "tailnet", "networking", "rmcp"]
description.workspace = true
autobins = false

[[bin]]
name = "rtailscale"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP / MCP transport
axum = "0.8"
rmcp = { workspace = true, features = [
  "server",
  "macros",
  "transport-streamable-http-server",
  "transport-io",
] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
toml = "0.8"

# OAuth + JWT
lab-auth = { git = "https://github.com/dinglebear-ai/labby.git", rev = "87cec3241f9baef22335de9cc8629ebbcd8ba047", package = "lab-auth" }
url = "2"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "chrono"] }

# Errors
anyhow.workspace = true
dotenvy = "0.15.7"

[features]
test-support = []

[dev-dependencies]
tailscale-rmcp = { path = ".", features = ["test-support"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
