name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Fast Rust
    uses: dinglebear-ai/workflows/.github/workflows/fast-rust.yml@66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d
    with:
      toolchain: "1.97.1"
      test-command: cargo test --workspace --all-features --locked
      timeout-minutes: 25
      kache-manifest-key: rtailscale-fast-rust
    secrets:
      KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_S3_ACCESS_KEY }}
      KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_S3_SECRET_KEY }}

  msrv:
    name: MSRV
    uses: dinglebear-ai/workflows/.github/workflows/rust-msrv.yml@66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d
    with:
      msrv: "1.97.1"

  docs:
    name: Rust documentation
    uses: dinglebear-ai/workflows/.github/workflows/rust-docs.yml@66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d

  security:
    name: Cargo deny
    uses: dinglebear-ai/workflows/.github/workflows/rust-security.yml@66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d

  npm:
    name: npm launcher
    uses: dinglebear-ai/workflows/.github/workflows/fast-node.yml@66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d
    with:
      working-directory: packages/tailscale-rmcp
      enable-cache: false
      install-command: "true"
      audit-command: ""
      lint-command: ""
      typecheck-command: ""
      test-command: npm test
      contract-command: npm run check && npm pack --dry-run --json

  operations:
    name: Workflow, TOML, and shell policy
    uses: dinglebear-ai/workflows/.github/workflows/fast-ops.yml@66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d
    with:
      shell-globs: >-
        install.sh entrypoint.sh scripts/install.sh scripts/check-*.sh
        scripts/validate-plugin-layout.sh scripts/kache-*.sh

  toml:
    name: TOML format
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: taplo-cli@0.10.0
      - run: taplo check

  install-contract:
    name: Installer contract
    uses: dinglebear-ai/workflows/.github/workflows/install-contract.yml@66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d
    with:
      contract-command: bash scripts/check-version-sync.sh && bash scripts/validate-plugin-layout.sh

  repository-contract:
    name: Fleet repository contract
    uses: dinglebear-ai/workflows/.github/workflows/fleet-contract.yml@66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d
    with:
      implementation-ref: 66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d
      profile: rust

  workflow-policy:
    name: Fleet workflow policy
    uses: dinglebear-ai/workflows/.github/workflows/fleet-policy.yml@66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - rust
      - msrv
      - docs
      - security
      - npm
      - operations
      - toml
      - install-contract
      - repository-contract
      - workflow-policy
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 5
    steps:
      - name: Require every CI lane
        env:
          RUST: ${{ needs.rust.result }}
          MSRV: ${{ needs.msrv.result }}
          DOCS: ${{ needs.docs.result }}
          SECURITY: ${{ needs.security.result }}
          NPM: ${{ needs.npm.result }}
          OPERATIONS: ${{ needs.operations.result }}
          TOML: ${{ needs.toml.result }}
          INSTALL_CONTRACT: ${{ needs.install-contract.result }}
          REPOSITORY_CONTRACT: ${{ needs.repository-contract.result }}
          WORKFLOW_POLICY: ${{ needs.workflow-policy.result }}
        run: |
          set -euo pipefail
          for result in \
            "$RUST" "$MSRV" "$DOCS" "$SECURITY" "$NPM" \
            "$OPERATIONS" "$TOML" "$INSTALL_CONTRACT" "$REPOSITORY_CONTRACT" \
            "$WORKFLOW_POLICY"; do
            test "$result" = success
          done
