name: npm package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  npm:
    name: npm launcher
    uses: dinglebear-ai/workflows/.github/workflows/fast-node.yml@d7bbe71ddc1157e32ed0bebf928fc07438ba58b0
    with:
      working-directory: packages/tailscale-rmcp
      enable-cache: false
      install-command: "true"
      audit-command: ""
      lint-command: ""
      typecheck-command: ""
      test-command: npm test
      contract-command: npm run check && npm pack --dry-run --json
