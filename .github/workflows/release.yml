name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  meta:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

  preflight:
    name: Verify released source
    needs: [meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tag commit on main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Require synchronized release metadata
        run: bash scripts/check-version-sync.sh

  build:
    name: Build hosted x86_64 release assets
    needs: [meta, preflight]
    uses: dinglebear-ai/workflows/.github/workflows/hosted-rust-platform-release.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      targets-json: >-
        [{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},
         {"runner":"windows-2025","target":"x86_64-pc-windows-msvc"}]
      build-command: cargo build --release --locked --target "$TARGET" --bin rtailscale
      package-command: |
        set -euo pipefail
        mkdir -p dist
        if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
          artifact="rtailscale-windows-x86_64.exe"
          archive="rtailscale-windows-x86_64.tar.gz"
          source="target/$TARGET/release/rtailscale.exe"
        else
          artifact="rtailscale-linux-x86_64"
          archive="rtailscale-x86_64.tar.gz"
          source="target/$TARGET/release/rtailscale"
        fi
        cp "$source" "dist/$artifact"
        sha256sum "dist/$artifact" > "dist/$artifact.sha256"
        tar -C dist -czf "dist/$archive" "$artifact"
        sha256sum "dist/$archive" > "dist/$archive.sha256"
      artifact-path: dist/*
      artifact-prefix: rtailscale

  github-release:
    name: Attach verified release assets
    needs: [build]
    uses: dinglebear-ai/workflows/.github/workflows/github-release.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      release-tag: ${{ github.event.release.tag_name }}
      artifact-pattern: rtailscale-*

  npm:
    name: Publish npm launcher
    needs: [meta, github-release]
    uses: dinglebear-ai/workflows/.github/workflows/npm-trusted-publish.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      expected-version: ${{ needs.meta.outputs.version }}
      working-directory: packages/tailscale-rmcp
      enable-cache: false
      install-command: "true"
      verify-command: npm test && npm run check && npm pack --dry-run --json
