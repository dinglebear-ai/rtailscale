# cargo-deny policy shared by the small Rust MCP services.

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
version = 2
# `spin 0.9.8` remains a transitive requirement of the pinned lab-auth RSA
# graph. Keep it visible while avoiding a permanently red gate with no
# compatible upgrade.
yanked = "warn"
ignore = [
  # RUSTSEC-2023-0071 has no fixed rsa release. This service uses the affected
  # graph only for short-lived JWT auth behind the deployment auth boundary.
  # Re-review by 2026-10-01 and remove as soon as lab-auth has a hardened path.
  { id = "RUSTSEC-2023-0071", reason = "temporary JWT-only exception through 2026-10-01; no fixed upstream rsa release exists" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/dinglebear-ai/labby.git"]
